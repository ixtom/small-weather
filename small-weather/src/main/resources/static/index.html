<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>small weather</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=Geist+Mono:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/3c553fe8e0.js" crossorigin="anonymous"></script>
    <script src="app.js" defer></script>
</head>
<body>



<div id="navbar">
    <div class="dropdown">
        <button class="dropbtn ntext" onclick="window.location.href='#';">Small Weather</button>
    </div>
    <div style=" display: flex;flex-direction: row;flex-wrap: wrap;gap:10px">
        <div class="dropdown">
            <button class="dropbtn ntext">About</button>
            <div class="dropdown-content">
                <a href="#">Placeholder xo</a>
            </div>
        </div>
        <div class="dropdown">
            <form action="https://github.com/ixtom/small-weather" method="get">
            <button class="dropbtn ntext">Repo</button></form>
        </div>        
    </div>
</div>

<div style="padding:30px 30px 30px 30px">
    <h1><i class="fa-solid fa-umbrella fa-spin-snap-8"></i>
        small weather
    </h1>
    <p>Select a Canadian city:</p>
    <select name="canadian cities" id="can citites">
        <option value="Vancouver"
            data-lat="49.2827"
            data-lon="-123.1207">Vancouver, BC</option>
        <option value="Halifax"
            data-lat="44.6488"
            data-lon="-63.5752">Halifax, NS</option>
        <option value="Calgary"
            data-lat="51.0447"
            data-lon="-114.0719">Calgary, AB</option>
        <option value="Victoria"
            data-lat="48.4284"
            data-lon="-123.3656">Victoria, BC</option>
        <option value="Toronto"
            data-lat="43.6532"
            data-lon="-79.3832">Toronto, ON</option>
    </select>
    <button onclick="sendweatherselect()">
        view city
    </button>
    <p>Or... select a preset city:</p>
    <div style="margin:auto;display:flex;flex-wrap: wrap;row-gap: 10px;gap:10px">
        <div class="dropdown">
                <form action="#" method="get">
                <button class="dropbtn ntext"onclick="sendweather('Kingston', 17.997, -76.7936)">Kingston, Jamaica</button></form>
        </div>
        <div class="dropdown">
                <form action="#" method="get">
                <button class="dropbtn ntext"onclick="sendweather('Singapore', 1.2897, 103.8501)">Singapore, Singapore</button></form>
        </div>
        <div class="dropdown">
                <form action="#" method="get">
                <button class="dropbtn ntext"onclick="sendweather('Moscow', 55.752, 37.6178)">Moscow, Russia</button></form>
        </div>
        <div class="dropdown">
                <form action="#" method="get">
                <button class="dropbtn ntext"onclick="sendweather('Bangkok', 13.754, 100.5014)">Bangkok, Thailand</button></form>
        </div>
        <div class="dropdown">
                <form action="#" method="get">
                <button class="dropbtn ntext"onclick="sendweather('Hanoi', 21.0245, 105.8412)">Hanoi, Vietnam</button></form>
        </div>
        <div class="dropdown">
                <form action="#" method="get">
                <button class="dropbtn ntext"onclick="sendweather('Sydney', -33.8678, 151.2073)">Sydney, Australia</button></form>
        </div>
        <div class="dropdown">
                <form action="#" method="get">
                <button class="dropbtn ntext"onclick="sendweather('Manila', 14.6042, 120.9822)">Manila, Philippines</button></form>
        </div>
        <div class="dropdown">
                <form action="#" method="get">
                <button class="dropbtn ntext"onclick="sendweather('Bloemfontein', -29.1211, 26.214)">Bloemfontein, South Africa</button></form>
        </div>
        <div class="dropdown">
                <form action="#" method="get">
                <button class="dropbtn ntext"onclick="sendweather('Rio de Janeiro', -22.9064, -43.1822)">Rio de Janeiro, Brazil</button></form>
        </div>
        <div class="dropdown">
                <form action="#" method="get">
                <button class="dropbtn ntext"onclick="sendweather('San Francisco', 37.7749, -122.4194)">San Francisco, United States of America</button></form>
        </div>
    </div>
    <div id="weather"></div>
</div>


</body>
</html>
